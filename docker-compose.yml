services:
  postgres:
    image: postgres:16-alpine
    container_name: parcel-postgres
    environment:
      POSTGRES_DB: parcel_demo
      POSTGRES_USER: parcel_user
      POSTGRES_PASSWORD: parcel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcel_user -d parcel_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: parcel-backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://parcel_user:parcel_password@postgres:5432/parcel_demo
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: parcel-demo-local-secret-change-me
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: parcel-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
